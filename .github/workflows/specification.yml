name: Specification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: specs/fractal-harness/package-lock.json
      - run: npm ci --ignore-scripts --prefix specs/fractal-harness
      - run: npm run check --prefix specs/fractal-harness
